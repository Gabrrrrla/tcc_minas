# MINAS (TCC Gabriela): copia de gnb_split_open5gs.yml apontando para o core Docker do MINAS (rede minas-net 10.11.0.0/24).
# Diferencas: cu_cp.amf.addr 10.11.0.20, cu_cp.amf.bind_addr e cu_up.ngu bind 10.11.0.1 (gateway da bridge, so existe com o compose no ar).

# SPDX-FileCopyrightText: Copyright (C) 2021-2026 Software Radio Systems Limited
# SPDX-License-Identifier: BSD-3-Clause-Open-MPI

# Example config for LiteOn RU in TDD mode, band n78, 100 MHz bandwidth.
# The main section of intereset is ru_ofh, which contains the configuration of the RU OFH application.
# Should the config not start as expected, please refer to the documentation for more details on the configuration options:
# https://docs.ocudu.org/user_manual/config_reference/

# Cópia de gnb_ru_liteon_SLICE.yml apontando para o core em Kubernetes do torre2 (link de fibra 10.10.0.0/24).
# Diferenças: cu_cp.amf.addr/bind_addr e cu_up.ngu (N3). Para voltar ao core bare metal, use a SLICE.yml original.
cu_cp:
  amf:
    addr: 10.11.0.20        # AMF do MINAS (container na minas-net)
    bind_addr: 10.11.0.1    # gateway da bridge minas-net no host
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: 0x111111
              - sst: 2
                sd: 0x222222  

cu_up:
  ngu:
    socket:
      - bind_addr: 10.11.0.1  # N3 (GTP-U); o UPF do MINAS anuncia 10.11.0.22

hal:
    eal_args: "--lcores=(2-5)@(2-5) --socket-mem=2048 -a 0000:ac:01.0"

expert_execution:
   affinities:
     main_pool_cpus: "0-15"

     ofh:
       timing_cpu: "9-15"
       txrx_cpus: [15]

   threads:
    ofh:
      enable_busy_waiting: true
    upper_phy: 
      max_pusch_and_srs_concurrency: 11 #define que é necessario apenas 11 cpus, pois meu setup está travando em apenas 11 disponiveis e 4t4r necessita de 15 por default

ru_ofh:
  t1a_max_cp_dl: 350 #350
  t1a_min_cp_dl: 200 #200
  t1a_max_cp_ul: 350 #350
  t1a_min_cp_ul: 200 #200
  t1a_max_up: 300 #00
  t1a_min_up: 0 #0
  ta4_max: 300 #300
  ta4_min: 0 #0
  is_prach_cp_enabled: true
  ignore_ecpri_payload_size: false
  ignore_ecpri_seq_id: true
  compr_method_ul: bfp
  compr_bitwidth_ul: 9
  compr_method_dl: bfp
  compr_bitwidth_dl: 9
  compr_method_prach: bfp
  compr_bitwidth_prach: 9
  enable_ul_static_compr_hdr: true
  enable_dl_static_compr_hdr: true
  iq_scaling: 5.0
  cells:
  - network_interface: 0000:ac:01.0 #   ens4f0np0 # 
    ru_mac_addr: e8:c7:4f:25:83:dd
    du_mac_addr: 0a:d8:5b:b8:cd:5c #  du-mac-address 0ad85bb8cd5c #
    vlan_tag_cp: 564
    vlan_tag_up: 564
    prach_port_id: [0,1,2,3] # mudança de 2t1r para 4t4r
    dl_port_id: [0,1,2,3]
    ul_port_id: [0,1,2,3]
    #prach_port_id: [0] 
    #dl_port_id: [0,1]
    #ul_port_id: [0]

cell_cfg:
  dl_arfcn: 649980
  band: 78
  channel_bandwidth_MHz: 100
  common_scs: 30
  plmn: "00101"
  tac: 1
  pci: 1
  nof_antennas_dl: 4 #4 mudança de 2t1r para 4t4r
  nof_antennas_ul: 4 #4
  prach:
    prach_config_index: 159
    prach_root_sequence_index: 1
    zero_correlation_zone: 0
    prach_frequency_start: 12
  slicing:
    - sst: 1
      sd: 0x111111
      sched_cfg:
        min_prb_policy_ratio: 50
        max_prb_policy_ratio: 70
    - sst: 2
      sd: 0x222222
      sched_cfg:
        min_prb_policy_ratio: 30
        max_prb_policy_ratio: 50
#e2: 
#  enable_du_e2: true
#  e2sm_kpm_enabled: true 
#  e2sm_rc_enabled: true 
#  addr: 127.0.0.1 
#  port: 32222
#  bind_addr: 127.0.0.1

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap

