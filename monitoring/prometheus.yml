global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "amf"
    static_configs:
      - targets: ["amf:9090"]

  - job_name: "smf"
    static_configs:
      - targets: ["smf:9090"]

  - job_name: "upf"
    static_configs:
      - targets: ["upf:9090"]

  # per-slice TUN counters (ogstun / ogstun2) from the UPF's network namespace
  - job_name: "upf-netdev"
    static_configs:
      - targets: ["upf:9100"]
