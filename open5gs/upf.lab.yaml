logger:
  file: /opt/open5gs/var/log/open5gs/upf.log

upf:
  pfcp:
    - dev: eth0
  gtpu:
    - dev: eth0
      # lab: the gNB runs on the host and reaches the UPF straight over the
      # docker bridge (no NAT) — advertise the UPF's own minas-net address
      advertise: 10.11.0.22
  subnet:
    - addr: 10.45.0.1/16
      dnn: internet
      dev: ogstun
    - addr: 10.46.0.1/16
      dnn: slice2
      dev: ogstun2
  metrics:
    - dev: eth0
      port: 9090

smf:
  pfcp:
    # IP fixo do SMF na minas-net (docker-compose.yml) — mesmo motivo do smf.yaml.
    - addr: 10.11.0.21
