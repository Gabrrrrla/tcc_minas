logger:
  file: /opt/open5gs/var/log/open5gs/amf.log

sbi:
  server:
    no_tls: true
  client:
    no_tls: true

amf:
  sbi:
    - dev: eth0
      port: 7777
  ngap:
    - dev: eth0
  metrics:
    - dev: eth0
      port: 9090
  guami:
    - plmn_id:
        mcc: 001
        mnc: 01
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 001
        mnc: 01
      s_nssai:
        - sst: 1
        - sst: 2
  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA0, NEA2, NEA1]
  network_name:
    full: MINAS-5G
  amf_name: open5gs-amf0

scp:
  sbi:
    - name: scp
      port: 7777
