# Lab overlay (UNISINOS server with srsRAN + Liteon RU). On top of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d
#
# Assumes the gNB runs NATIVELY on the same Linux host (DPDK), reaching the
# core straight over the docker bridge — no port publishing/NAT on N2/N3:
#   srsran gnb.yaml:  amf.addr 10.11.0.20 (AMF),  amf.bind_addr 10.11.0.1 (bridge gateway)
#   upf.lab.yaml:     GTP-U advertised as 10.11.0.22 (UPF), instead of 127.0.0.1
# Run scripts/lab_preflight.sh on the host first (SCTP module, subnet clash,
# Ollama reachability, ports).

services:
  upf:
    volumes:
      - ./open5gs/upf.lab.yaml:/opt/open5gs/etc/open5gs/upf.yaml
    # Same TUN setup as the base file, plus NAT so UE traffic can leave the
    # UPF (to the iperf server below, or the internet if the host has it).
    command:
      - "ip tuntap add name ogstun mode tun 2>/dev/null || true; ip addr add 10.45.0.1/16 dev ogstun 2>/dev/null || true; ip link set ogstun up; ip tuntap add name ogstun2 mode tun 2>/dev/null || true; ip addr add 10.46.0.1/16 dev ogstun2 2>/dev/null || true; ip link set ogstun2 up; echo 1 > /proc/sys/net/ipv4/ip_forward; iptables -t nat -C POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE; iptables -t nat -C POSTROUTING -s 10.46.0.0/16 ! -o ogstun2 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.46.0.0/16 ! -o ogstun2 -j MASQUERADE; exec open5gs-upfd"

  # Traffic target for the UEs: `iperf3 -c 10.11.0.70 -R -b 20M` from a UE on
  # the eMBB slice drives DL demand at the intent's target, which is what makes
  # the SLA compliance rate meaningful (agents/benchmark/sla_report.py).
  iperf:
    image: networkstatic/iperf3:latest
    container_name: iperf
    command: ["-s"]
    networks:
      minas-net:
        ipv4_address: 10.11.0.70
    depends_on: [upf]

  # iperf3 -s serves ONE client at a time: a second server for the second UE
  # (two UEs on the two slices at once, LAB-ROTEIRO E2).
  iperf-b:
    image: networkstatic/iperf3:latest
    container_name: iperf-b
    command: ["-s"]
    networks:
      minas-net:
        ipv4_address: 10.11.0.71
    depends_on: [upf]

  collector:
    environment:
      CORE_SOURCE: prometheus    # real per-slice throughput from upf-netdev (ogstun/ogstun2)
      RAN_SOURCE: prometheus     # UPF-side throughput until a RAN_SOURCE=srsran exists

  # --- Real enforcement (agents/enforcement.py) ------------------------------
  # Core: tc rate limit per slice on the UPF's TUN devices. Shares the UPF's
  # network namespace, so it is reachable at upf:9300 and sees ogstun/ogstun2.
  upf-shaper:
    build:
      context: .
      dockerfile: agents/enforcers/Dockerfile
    image: minas-enforcer:local
    container_name: upf-shaper
    network_mode: "service:upf"
    cap_add: [NET_ADMIN]
    environment:
      SLICE_TUN: "${SLICE_TUN:-1:ogstun,2:ogstun2}"
    depends_on: [upf]
    restart: unless-stopped

  # RAN: gnb_slicer.py runs natively on the host (next to the gNB), port 8010,
  # reached through the minas-net bridge gateway. Start it before the agents:
  #   sudo GNB_TEMPLATE=<gnb.yaml do lab> python3 agents/enforcers/gnb_slicer.py
  cn-nssmf:
    environment:
      ENFORCEMENT_MODE: "${ENFORCEMENT_MODE:-real}"
      UPF_SHAPER_URL: http://upf:9300
      UPF_SHAPING: "${UPF_SHAPING:-true}"   # false: no rate limit at the UPF (see agents/enforcement.py)
    depends_on: [upf-shaper]

  ran-nssmf:
    environment:
      ENFORCEMENT_MODE: "${ENFORCEMENT_MODE:-real}"
      GNB_SLICER_URL: "${GNB_SLICER_URL:-http://10.11.0.1:8010}"
      ENFORCEMENT_TIMEOUT_S: "${ENFORCEMENT_TIMEOUT_S:-90}"   # a gNB restart answers after the cell is back up
      # cell model (ran-nssmf/tools.py): set from the lab cell after E0, LAB-ROTEIRO
      RAN_PRB_TOTAL: "${RAN_PRB_TOTAL:-51}"
      RAN_MBPS_PER_PRB: "${RAN_MBPS_PER_PRB:-0.40}"

  # same cell model for the NWDAF's load level (capacity = PRB_TOTAL x MBPS_PER_PRB)
  nwdaf:
    environment:
      RAN_PRB_TOTAL: "${RAN_PRB_TOTAL:-51}"
      RAN_MBPS_PER_PRB: "${RAN_MBPS_PER_PRB:-0.40}"
