# # srsRAN gNB — MINAS testbed
#
# #   GNB_BIND_ADDR  > IP do servidor do lab na rede de fronthaul (ex: 192.168.x.x)
# #   RU_MAC         > MAC da RU Liteon Flexi  (ver: ip link show)
# #   DU_MAC         > MAC da placa Intel DPDK do servidor (ver: ip link show)
# #   FRONTHAUL_IF   > nome da interface de rede conectada à RU (ver: ip link show)
# #   DL_ARFCN       > confirmar com o Miguel (depende da frequência configurada na Liteon)
# #   BAND           > confirmar com o Miguel
# gnb_id: 1
# ran_node_name: minas-gnb
#
# # N2/N3 direto pela bridge do Docker (docker-compose.lab.yml), sem NAT:
# #   o host alcança a rede minas-net (10.11.0.0/24) e 10.11.0.1 é o gateway
# #   da bridge no host. O UPF anuncia GTP-U em 10.11.0.22 (open5gs/upf.lab.yaml).
# #   (127.0.0.1 via porta publicada também sobe o NGAP, mas SCTP atrás do NAT
# #   do Docker e o GTP-U anunciado em loopback são frágeis.)
# #   Antes: sudo modprobe sctp   (scripts/lab_preflight.sh confere)
# #   Chaves exatas dependem da versão do srsRAN Project — conferir com o
# #   gnb.yaml que o Miguel já usa com a Liteon.
# amf:
#   addr: 10.11.0.20      # AMF (container) na minas-net
#   bind_addr: 10.11.0.1  # gateway da bridge minas-net no host
#
# ru_ofh:
#   t1a_max_cp_dl: 500
#   t1a_min_cp_dl: 250
#   t1a_max_cp_ul: 500
#   t1a_min_cp_ul: 250
#   t1a_max_up: 300
#   t1a_min_up: 85
#   ta4_max: 300
#   ta4_min: 85
#   is_prach_cp_enabled: true
#   ignore_ecpri_seq_id_field: true
#   cells:
#     - network_interface: FRONTHAUL_IF
#       ru_mac_addr: "RU_MAC"
#       du_mac_addr: "DU_MAC"
#       vlan_tag_cp: 1
#       vlan_tag_up: 1
#
# cell_cfg:
#   dl_arfcn: DL_ARFCN
#   band: BAND
#   channel_bandwidth_MHz: 20
#   common_scs: 30
#   plmn: "00101"
#   tac: 1
#   pci: 1
#   nof_antennas_ul: 1
#   nof_antennas_dl: 1
#
# # PLMN/TAC/S-NSSAI têm que bater com open5gs/amf.yaml, com o IMSI dos SIMs e
# # com scripts/provision.js (00101, TAC 1, SST 1 e 2 sem SD).
# # Divisão de PRB por slice: versões recentes do srsRAN Project aceitam
# # sched_cfg por slice (estático — mudar exige reiniciar o gNB). É o ponto
# # onde um enforcement real do allocate_prb (RAN-NSSMF) atuaria.
# slicing:
#   - sst: 1
#     # sched_cfg:
#     #   min_prb_policy_ratio: 0
#     #   max_prb_policy_ratio: 100
#   - sst: 2
#     # sched_cfg:
#     #   min_prb_policy_ratio: 20   # reserva p/ URLLC (UC1)
#     #   max_prb_policy_ratio: 100
#
# log:
#   filename: /tmp/gnb.log
#   all_level: info
#
# pcap:
#   mac_filename: /tmp/gnb_mac.pcap
#   mac_enable: false
#   ngap_filename: /tmp/gnb_ngap.pcap
#   ngap_enable: true


