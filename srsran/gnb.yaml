# # srsRAN gNB — MINAS testbed
#
# #   GNB_BIND_ADDR  > IP of the lab server on the fronthaul network (e.g. 192.168.x.x)
# #   RU_MAC         > MAC of the LiteOn Flexi RU (see: ip link show)
# #   DU_MAC         > MAC of the server's Intel DPDK NIC (see: ip link show)
# #   FRONTHAUL_IF   > name of the network interface connected to the RU (see: ip link show)
# #   DL_ARFCN       > check with the lab staff (depends on the frequency configured on the RU)
# #   BAND           > check with the lab staff
# gnb_id: 1
# ran_node_name: minas-gnb
#
# # N2/N3 directly over the Docker bridge (docker-compose.lab.yml), without NAT:
# #   the host reaches the minas-net network (10.11.0.0/24) and 10.11.0.1 is the
# #   bridge gateway on the host. The UPF advertises GTP-U on 10.11.0.22 (open5gs/upf.lab.yaml).
# #   (127.0.0.1 through a published port also brings NGAP up, but SCTP behind the
# #   Docker NAT and GTP-U advertised on loopback are fragile.)
# #   Before: sudo modprobe sctp   (checked by scripts/lab_preflight.sh)
# #   The exact keys depend on the srsRAN Project version — check against the
# #   gnb.yaml already used in the lab with the RU.
# amf:
#   addr: 10.11.0.20      # AMF (container) on minas-net
#   bind_addr: 10.11.0.1  # minas-net bridge gateway on the host
#
# ru_ofh:
#   t1a_max_cp_dl: 500
#   t1a_min_cp_dl: 250
#   t1a_max_cp_ul: 500
#   t1a_min_cp_ul: 250
#   t1a_max_up: 300
#   t1a_min_up: 85
#   ta4_max: 300
#   ta4_min: 85
#   is_prach_cp_enabled: true
#   ignore_ecpri_seq_id_field: true
#   cells:
#     - network_interface: FRONTHAUL_IF
#       ru_mac_addr: "RU_MAC"
#       du_mac_addr: "DU_MAC"
#       vlan_tag_cp: 1
#       vlan_tag_up: 1
#
# cell_cfg:
#   dl_arfcn: DL_ARFCN
#   band: BAND
#   channel_bandwidth_MHz: 20
#   common_scs: 30
#   plmn: "00101"
#   tac: 1
#   pci: 1
#   nof_antennas_ul: 1
#   nof_antennas_dl: 1
#
# # PLMN/TAC/S-NSSAI must match open5gs/amf.yaml, the IMSI of the SIMs, and
# # scripts/provision.js (00101, TAC 1, SST 1 and 2 without SD).
# # PRB split per slice: recent srsRAN Project versions accept
# # sched_cfg per slice (static — changing it requires restarting the gNB). This is
# # where real enforcement of allocate_prb (RAN-NSSMF) acts.
# slicing:
#   - sst: 1
#     # sched_cfg:
#     #   min_prb_policy_ratio: 0
#     #   max_prb_policy_ratio: 100
#   - sst: 2
#     # sched_cfg:
#     #   min_prb_policy_ratio: 20   # reserva p/ URLLC (UC1)
#     #   max_prb_policy_ratio: 100
#
# log:
#   filename: /tmp/gnb.log
#   all_level: info
#
# pcap:
#   mac_filename: /tmp/gnb_mac.pcap
#   mac_enable: false
#   ngap_filename: /tmp/gnb_ngap.pcap
#   ngap_enable: true


